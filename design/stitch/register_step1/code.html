  </head><body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Go back" class="w-12 h-12 -ml-2 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight truncate">Set up your restaurant</h1></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 bg-surface"><div class="flex flex-col w-full">
<!-- Stepper Progress Header -->
<div class="px-margin pt-space-md pb-space-sm">
<div class="flex items-center justify-between mb-space-xs">
<span class="font-body-sm text-body-sm text-on-surface-variant font-medium">Step 1 of 4</span>
<span class="font-label-sm text-label-sm text-primary uppercase tracking-wider font-semibold">Basic Details</span>
</div>
<div class="grid grid-cols-4 gap-1 w-full h-1">
<div class="h-1 rounded-full bg-primary-container"></div>
<div class="h-1 rounded-full bg-surface-container-highest"></div>
<div class="h-1 rounded-full bg-surface-container-highest"></div>
<div class="h-1 rounded-full bg-surface-container-highest"></div>
</div>
</div>
<!-- Warm Introductory Context -->
<div class="px-margin pt-space-md pb-space-md">
<div class="flex items-start justify-between gap-space-md">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Tell us about your restaurant</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs">This is what customers will see on your storefront.</p>
</div>
<div class="w-10 h-10 rounded-xl bg-tertiary-fixed flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary text-[22px]">storefront</span>
</div>
</div>
</div>
<!-- Registration Form Block -->
<form class="px-margin flex flex-col gap-space-lg pb-32" id="register-step1-form" onsubmit="event.preventDefault();">
<!-- Restaurant Name -->
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant font-medium" for="restaurant-name">Restaurant name</label>
<div class="relative w-full">
<input class="w-full h-[52px] px-4 rounded-xl bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:bg-surface-container-low transition-colors" id="restaurant-name" placeholder="e.g. Milton Feast Bar" required="" type="text" value="Spice Garden" style="border: 1px solid rgb(143, 134, 126); background-color: rgb(255, 255, 255); box-shadow: none;">
<div class="absolute right-3.5 top-1/2 -translate-y-1/2 text-primary flex items-center">
<span class="material-symbols-outlined text-[18px]">check_circle</span>
</div>
</div>
</div>
<!-- Phone Number Field -->
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant font-medium" for="phone-number">Phone</label>
<div class="flex items-center w-full h-[52px] rounded-xl bg-surface-container-lowest px-3 gap-2 focus-within:bg-surface-container-low transition-colors" style="border: 1px solid rgb(143, 134, 126); background-color: rgb(255, 255, 255); box-shadow: none;">
<!-- UK Identifier Badge -->
<div class="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-surface-container text-on-surface shrink-0">
<span aria-label="United Kingdom Flag" class="text-[14px] leading-none" role="img">🇬🇧</span>
<span class="font-label-md text-label-md font-semibold text-on-surface">+44</span>
</div>
<input class="w-full h-full bg-transparent text-on-surface font-body-md text-body-md focus:outline-none" id="phone-number" placeholder="7123 456789" required="" type="tel" value="07123 456789">
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant px-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">info</span>
        Customers and drivers may call this number.
      </p>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant font-medium" for="owner-email">Email</label>
<div class="relative w-full">
<input class="w-full h-[52px] px-4 rounded-xl bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:bg-surface-container-low transition-colors" id="owner-email" placeholder="store@example.co.uk" required="" type="email" value="hello@spicegarden.co.uk" style="border: 1px solid rgb(143, 134, 126); background-color: rgb(255, 255, 255); box-shadow: none;">
<div class="absolute right-3.5 top-1/2 -translate-y-1/2 text-primary flex items-center">
<span class="material-symbols-outlined text-[18px]">check_circle</span>
</div>
</div>
</div>
<!-- Cuisine Types Section -->
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<label class="font-body-sm text-body-sm text-on-surface-variant font-medium">Cuisine types</label>
<span class="font-label-sm text-label-sm text-on-surface-variant" id="cuisine-count">2 selected</span>
</div>
<!-- Active Cuisines Cluster -->
<div class="flex flex-wrap gap-2 pt-1 pb-1" id="selected-cuisines">
<span class="cuisine-tag inline-flex items-center gap-1.5 h-9 pl-3.5 pr-2.5 rounded-full bg-tertiary-fixed text-primary font-label-md text-label-md font-semibold">
          Indian
          <button aria-label="Remove Indian" class="w-5 h-5 rounded-full flex items-center justify-center text-primary hover:bg-primary/10 transition-colors" onclick="this.parentElement.remove(); updateCuisineCount();" type="button">
<span class="material-symbols-outlined text-[15px]">close</span>
</button>
</span>
<span class="cuisine-tag inline-flex items-center gap-1.5 h-9 pl-3.5 pr-2.5 rounded-full bg-tertiary-fixed text-primary font-label-md text-label-md font-semibold">
          Curry
          <button aria-label="Remove Curry" class="w-5 h-5 rounded-full flex items-center justify-center text-primary hover:bg-primary/10 transition-colors" onclick="this.parentElement.remove(); updateCuisineCount();" type="button">
<span class="material-symbols-outlined text-[15px]">close</span>
</button>
</span>
</div>
<!-- Cuisine Input Field -->
<div class="relative w-full">
<input class="w-full h-[52px] pl-4 pr-12 rounded-xl bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-low transition-colors" id="add-cuisine-input" onkeydown="if(event.key === 'Enter'){ event.preventDefault(); addCustomCuisine(); }" placeholder="Add a cuisine" type="text" style="border: 1px solid rgb(143, 134, 126); background-color: rgb(255, 255, 255); box-shadow: none;">
<button aria-label="Add cuisine tag" class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant hover:bg-primary-container hover:text-on-primary transition-colors" onclick="addCustomCuisine()" type="button">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
<!-- Quick Suggestion Pills -->
<div class="pt-1">
<span class="font-label-sm text-label-sm text-on-surface-variant block mb-2 font-medium">Suggestions</span>
<div class="flex flex-wrap gap-2" id="suggestion-pool">
<button class="h-9 px-3.5 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md font-medium hover:bg-surface-container-high transition-colors" onclick="selectSuggestion(this, 'Italian')" type="button">Italian</button>
<button class="h-9 px-3.5 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md font-medium hover:bg-surface-container-high transition-colors" onclick="selectSuggestion(this, 'Chinese')" type="button">Chinese</button>
<button class="h-9 px-3.5 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md font-medium hover:bg-surface-container-high transition-colors" onclick="selectSuggestion(this, 'Pizza')" type="button">Pizza</button>
<button class="h-9 px-3.5 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md font-medium hover:bg-surface-container-high transition-colors" onclick="selectSuggestion(this, 'Burgers')" type="button">Burgers</button>
<button class="h-9 px-3.5 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md font-medium hover:bg-surface-container-high transition-colors" onclick="selectSuggestion(this, 'Desserts')" type="button">Desserts</button>
<button class="h-9 px-3.5 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md font-medium hover:bg-surface-container-high transition-colors" onclick="selectSuggestion(this, 'Vegetarian')" type="button">Vegetarian</button>
</div>
</div>
</div>
<!-- Description Multi-Line Field -->
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<label class="font-body-sm text-body-sm text-on-surface-variant font-medium" for="restaurant-description">Description</label>

</div>
<div class="w-full">
<textarea class="w-full p-4 rounded-xl bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:bg-surface-container-low transition-colors resize-none leading-relaxed" id="restaurant-description" maxlength="200" oninput="updateCharCount(this)" placeholder="Briefly describe your culinary style, specialties, or history..." rows="4" style="border: 1px solid rgb(143, 134, 126); background-color: rgb(255, 255, 255); box-shadow: none;">Family-run Indian kitchen serving slow-cooked curries and fresh breads in Milton Keynes.</textarea>
</div>
</div>
<!-- Kitchen Atmosphere Micro Card -->

</form>
<!-- Sticky Solid Action Footer -->
<div class="fixed bottom-0 left-0 right-0 z-40 bg-surface-container-lowest pb-safe">
<div class="px-margin py-space-lg max-w-md mx-auto">
<button class="w-full h-[52px] rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg font-bold flex items-center justify-center gap-2 active:bg-primary transition-colors focus:outline-none" id="continue-button" onclick="handleStepCompletion()" type="button" style="box-shadow: none;">
<span class="">Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</div>
<script>
  function updateCuisineCount() {
    const container = document.getElementById('selected-cuisines');
    const tags = container.querySelectorAll('.cuisine-tag');
    const countEl = document.getElementById('cuisine-count');
    if (countEl) {
      countEl.textContent = `${tags.length} selected`;
    }
  }

  function addCustomCuisine() {
    const input = document.getElementById('add-cuisine-input');
    const value = input.value.trim();
    if (!value) return;

    createCuisineChip(value);
    input.value = '';
    updateCuisineCount();
  }

  function createCuisineChip(name) {
    const container = document.getElementById('selected-cuisines');
    
    // Avoid exact duplicate chip tags
    const existing = Array.from(container.querySelectorAll('.cuisine-tag')).map(el => el.childNodes[0].textContent.trim());
    if (existing.includes(name)) return;

    const span = document.createElement('span');
    span.className = 'cuisine-tag inline-flex items-center gap-1.5 h-9 pl-3.5 pr-2.5 rounded-full bg-tertiary-fixed text-primary font-label-md text-label-md font-semibold';
    span.innerHTML = `
      ${name}
      <button type="button" aria-label="Remove ${name}" onclick="this.parentElement.remove(); updateCuisineCount();" class="w-5 h-5 rounded-full flex items-center justify-center text-primary hover:bg-primary/10 transition-colors">
        <span class="material-symbols-outlined text-[15px]">close</span>
      </button>
    `;
    container.appendChild(span);
    updateCuisineCount();
  }

  function selectSuggestion(btn, name) {
    createCuisineChip(name);
    btn.classList.add('opacity-40', 'pointer-events-none');
  }

  function updateCharCount(el) {
    const counter = document.getElementById('char-counter');
    if (counter) {
      counter.textContent = `${el.value.length}/200`;
    }
  }

  function handleStepCompletion() {
    const btn = document.getElementById('continue-button');
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span><span>Saving Details...</span>';
    setTimeout(() => {
      btn.innerHTML = '<span>Step 2: Operating Hours</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span>';
    }, 450);
  }
</script></main>

</body></html>
